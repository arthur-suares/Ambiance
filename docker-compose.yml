services:
  postgres:
    build:
      context: ./docker/postgres
    image: trase-rag-postgres-postgis:pg17
    container_name: trase-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-rag}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Defina PG_PASSWORD no .env}
      POSTGRES_DB: ${PG_DATABASE:-trase_rag}
    ports:
      # 5433 no host para não conflitar com um Postgres local na 5432.
      - "${PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: trase-rag-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@agro.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-agro1234}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  pgdata:
  pgadmin_data:
