services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    container_name: trase-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-rag}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Defina PG_PASSWORD no .env}
      POSTGRES_DB: ${PG_DATABASE:-trase_rag}
    ports:
      # 5433 no host para não conflitar com um Postgres local na 5432.
      - "${PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
