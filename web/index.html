<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trase RAG</title>
<style>
  :root { --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --border: #d0d7de; --panel: #f6f8fa; --accent: #0969da; --error: #cf222e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0; --border: #30363d; --panel: #161b22; --accent: #4493f8; --error: #f85149; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  textarea { width: 100%; min-height: 80px; padding: 10px; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; resize: vertical; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  button { padding: 8px 16px; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 6px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  label { color: var(--muted); font-size: 14px; }
  input[type=number] { width: 56px; padding: 4px; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; }
  h2 { font-size: 15px; margin: 24px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  #answer { white-space: pre-wrap; padding: 14px; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; }
  ol { padding-left: 24px; margin: 0; }
  li { margin-bottom: 4px; }
  a { color: var(--accent); }
  .meta { color: var(--muted); font-size: 13px; }
  details { margin-top: 16px; }
  summary { cursor: pointer; color: var(--muted); }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 12.5px; padding: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; max-height: 480px; overflow: auto; }
  .error { color: var(--error); }
  .call { margin-bottom: 10px; }
  .call code { font-size: 12.5px; word-break: break-word; }
  select { padding: 4px; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; margin: 8px 0; font-size: 14px; white-space: normal; }
  th, td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Trase RAG — cadeia da carne bovina e leis ambientais</h1>

  <form id="form">
    <textarea id="question" placeholder="Ex.: Quais grupos exportadores tiveram maior exposição ao desmatamento em 2023? / Qual a multa para quem desmata sem autorização?" required></textarea>
    <div class="row">
      <button id="send" type="submit">Perguntar</button>
      <label>Modo: <select id="mode"><option value="agent">Dados + leis</option><option value="laws">Só leis</option></select></label>
      <label>Trechos de lei (k): <input id="k" type="number" min="1" max="20" value="6"></label>
      <span id="status" class="meta"></span>
    </div>
  </form>

  <section id="result" hidden>
    <h2>Resposta</h2>
    <div id="answer"></div>

    <section id="calls-section" hidden>
      <h2>Consultas aos dados</h2>
      <div id="calls"></div>
    </section>

    <section id="sources-section">
      <h2>Fontes (leis)</h2>
      <ol id="sources"></ol>
    </section>
    <p id="usage" class="meta"></p>

    <details id="context-details">
      <summary>Trechos enviados ao LLM</summary>
      <pre id="context"></pre>
    </details>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Markdown mínimo: negrito e tabelas; o resto fica como texto (igual ao terminal).
function renderInline(s) {
  return escapeHtml(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
}

function renderAnswer(text) {
  const lines = text.split("\n");
  const isRow = (l) => /^\s*\|.*\|\s*$/.test(l);
  const isSep = (l) => /^\s*\|[\s:|-]+\|\s*$/.test(l);
  const cells = (l) => l.trim().slice(1, -1).split("|").map((c) => renderInline(c.trim()));
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    if (isRow(lines[i]) && isSep(lines[i + 1] || "")) {
      let html = "<div class='table-wrap'><table><thead><tr>" +
        cells(lines[i]).map((c) => `<th>${c}</th>`).join("") + "</tr></thead><tbody>";
      i += 2;
      for (; i < lines.length && isRow(lines[i]); i++) {
        html += "<tr>" + cells(lines[i]).map((c) => `<td>${c}</td>`).join("") + "</tr>";
      }
      i--;
      out.push(html + "</tbody></table></div>");
    } else {
      out.push(renderInline(lines[i]) + "\n");
    }
  }
  return out.join("");
}

$("question").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("form").requestSubmit();
});

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = $("question").value.trim();
  if (!question) return;

  $("send").disabled = true;
  $("status").textContent = "Buscando e gerando resposta...";
  $("status").classList.remove("error");

  try {
    const res = await fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, k: Number($("k").value) || 6, mode: $("mode").value }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

    $("answer").innerHTML = renderAnswer(data.answer);
    $("sources").innerHTML = data.sources.map((s) => {
      const parte = s.partes > 1 ? ` (parte ${s.parte}/${s.partes})` : "";
      const ranks = `semântica #${s.semantic_rank ?? "–"}, palavra-chave #${s.keyword_rank ?? "–"}`;
      const label = s.label ? `[${escapeHtml(s.label)}] ` : "";
      return `<li>${label}${escapeHtml(s.title)}, art. ${escapeHtml(String(s.artigo))}${parte} — ` +
             `<a href="${escapeHtml(s.url)}" target="_blank" rel="noopener">fonte</a> ` +
             `<span class="meta">(score ${s.score.toFixed(4)}; ${ranks})</span></li>`;
    }).join("");
    $("usage").textContent =
      `${data.input_tokens} tokens de entrada, ${data.output_tokens} de saída · ${data.seconds}s · stop_reason: ${data.stop_reason}`;
    const calls = data.tool_calls || [];
    $("calls").innerHTML = calls.map((c) =>
      `<details class="call"><summary>[${escapeHtml(c.label)}] <code>${escapeHtml(c.summary)}</code> ` +
      `<span class="meta">${c.ok ? (c.rows ?? "") + " linhas" : "<span class='error'>erro</span>"} · ${c.seconds}s</span></summary>` +
      `<pre>${escapeHtml(c.output)}</pre></details>`
    ).join("");
    $("calls-section").hidden = calls.length === 0;
    $("sources-section").hidden = data.sources.length === 0;
    $("context").textContent = data.context || "";
    $("context-details").hidden = !data.context;
    $("result").hidden = false;
    $("status").textContent = "";
  } catch (err) {
    $("status").textContent = "Erro: " + err.message;
    $("status").classList.add("error");
  } finally {
    $("send").disabled = false;
  }
});
</script>
</body>
</html>
